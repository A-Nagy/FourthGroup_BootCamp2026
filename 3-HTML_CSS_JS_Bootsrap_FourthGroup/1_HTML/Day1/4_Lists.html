<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>

        <h2>Order List القوائم المرتبة      </h2>
        <ol>
            <li>Html</li>
            <li>Css</li>
            <li>JS</li>
        </ol>

    <h2>Unorder List القوائم غير المرتبة</h2>
        <ul>
            <li>Vs Code </li>
            <li>Git</li>
            <li>Browser</li>
        </ul>

    <h2>Describtion List القوائم الوصفية </h2>    
        <dl>
            <dt><b>Html</b></dt>
            <dd>لغة الترميز لبناء صفحات الويب </dd>

            <dt><u>Css</u></dt>
            <dd>لغة تنسيق صفحات الويب</dd>
        </dl>

</body>
</html>
