<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Type </title>
</head>
<body>
    <h2>Type Of Inputs in Forms</h2>
    <form>
        <label for="name">Name :</label>
        <input type="text" id="name" name="name">
        <br>
        <br>
        <label for="email">Email : </label>
        <input type="email" id="email" name="email">
        <br>
        <br>
        <label for="password">Password : </label>
        <input type="password" id="password" name="password">
        <br>
        <br>
        <label for="bd">BirthDate:</label>
        <input type="date" id="bd" name="bd">
        <br>
        <br>
        <label for="Count">Count Of Courses : </label>
        <input type="number" id="Count" name="Count" min="0" max="250">
        <br>
        <br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" >
        <br>
        <br>
        <label for="price">Price</label>
        <input type="range" id="price" name="price" min="0" max="100">
        <br>
        <br>
        <label for="color">Color : </label>
        <input type="color" id="color" name="color">
        <br>
        <br>
        <label for="upload">Upload File :</label>
        <input type="file" id="upload" name="upload">
        <br>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
