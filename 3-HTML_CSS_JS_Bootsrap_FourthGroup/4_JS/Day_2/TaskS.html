<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Answer</title>
    <style>
        #result
        {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: brown;
            background-color: aquamarine;
        }
    </style>
</head>
<body>

    <div id="result"></div>

    <h2>Welcome</h2>
    <label for="ageinput">Age :</label>
    <input type="number" min="5" max="100" id="ageinput" placeholder="Enter Your Age" >
    <button onclick="showage()">Show Age </button>

<script>
function showage()
{
    let age = document.getElementById("ageinput").value ; 
    if(age.trim()==="")
    {
        document.getElementById("result").innerText="please Enter Valid Age" ; 
    }
    else
    {
        document.getElementById("result").innerText="Your age is :"+age ; 
    }
}

</script>

 

 <h2>Welcome For Secand Time </h2>

    <label for="nameinput">Name :</label>
    <input type="text" id="nameinput" placeholder="Enter Your Name" >
    <br> <br>
    <label for="ageinpu">Age :</label>
    <input type="number" min="5" max="100" id="ageinpu" >
    <br> <br>
    <label for="emailinput">Email :</label>
    <input type="email" id="emailinput" placeholder="Enter Your Email" >
      <br> <br>
    <button onclick="showdata()">Show All Data </button>
 
<script>

function showdata()
{
    let name  = document.getElementById("nameinput").value ; 
    let age2  = document.getElementById("ageinpu").value ; 
    let email = document.getElementById("emailinput").value ; 
    if(!name || !age2 || !email)
    {
        document.getElementById("result").innerText="please Enter your Data" ; 
    }
    else
    {
        document.getElementById("result").innerText=`
        your Name is : ${name} \n Your Age is : ${age2} \n your Email is : ${email} 
        `; 
    }
}

</script>

<h2>Welcome Greeting Based on Time </h2>

<button onclick="greetingMe()">Greet me </button>
<script>
    function greetingMe()
    {
        const hour = new Date().getHours();
        let greet = ""; 
        if(hour < 12 ){greet="Good Morning";}
        else if(hour < 18 ){greet="Good AfterNoon";}
        else{greet="Good Evening";}
        document.getElementById("result").innerText= greet ;
    }
</script>
   

</body>
</html>
