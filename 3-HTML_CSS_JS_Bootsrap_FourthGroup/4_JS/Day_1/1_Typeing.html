<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Into Html</title>
</head>
<body>
    <h1>What Can Js Do ?</h1>
    <p id="demo">js Can Change Html Content</p>    
    <button type="button" 
    onclick="document.getElementById('demo').innerHTML='That is Right ...'">
    Click Me</button>
    <p>js Can Change html attribute values</p>
    <img src="pic_bulbon.gif" alt="Img" id="myimg">
    <button type="button" onclick='document.getElementById("myimg").src
    ="pic_bulboff.gif"'> Turn off</button>
    <button type="button" onclick='document.getElementById("myimg").src
    ="pic_bulbon.gif"'> Turn on</button>
</body>
</html>
